<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
   <title>Frontend Mentor | QR code component</title>


  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
  
  html {
    box-sizing: border-box;
  }
  
  body {
    background-color:  hsl(212, 45%, 89%);
    justify-content: center ;
    align-content:center ;
  }
  .card {
     background-color: white;
     box-sizing: border-box;
     width: 90%;
     aspect-ratio: 1;
     align-self: center;
     margin: 18vh auto;
     text-align: center;
     border-radius: 25px;
     padding-bottom: 15px;
     padding-top: 20px;
     box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
  }
  
  h3 {
    font-family: Poppins;
    color: hsl(218, 44%, 22%) ;
    font-weight: 700;
    font-size: 1.2em;
  }
  
  .t2 {
    font-family: Inter;
    font-weight: 400;
    color: hsl(216, 15%, 48%);
    line-height: 1.2em;
    font-size: 15px;
  }
  img {
    border-radius: 15px;
    
  }
  
  
  
  
  </style>
  
</head>


<body>
  
    <div class="card">
      
      
         <img alt="QRCODE" src="/images/image-qr-code.png" width="90%">
      
      
      
            <h3 class="t1">  Improve your front-end <br> skills by building projects </h3>
      
          <p class="t2">
    Scan the QR code to visit Frontend <br> Mentor and take your coding skills to<br>  the next level </p>
    </div>
    
  
</body>
</html>
